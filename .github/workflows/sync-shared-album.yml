name: Sync shared album

on:
  workflow_dispatch:
  schedule:
    # Every 2 hours at :17 UTC — iCloud CDN URLs expire ~3h after generation.
    - cron: '17 */2 * * *'

permissions:
  contents: write

concurrency:
  group: sync-shared-album
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --omit=dev || npm install

      - name: Run album sync
        env:
          GDRIVE_SA_KEY: ${{ secrets.GDRIVE_SA_KEY }}
        run: node scripts/sync-shared-album.js

      - name: Validate config
        run: node scripts/validate-gacha-config.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/photos.json
          git add media/photos/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes. Skipping commit."
            exit 0
          fi
          git commit -m "chore(album): sync shared album [skip ci]"
          git push
