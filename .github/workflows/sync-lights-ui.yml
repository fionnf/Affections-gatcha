name: Sync lights UI

# lichter.html is the linked_friend_lights web app vendored into this repo so
# it lives inside the PWA. This job re-pulls it whenever the source changes, so
# improving the lights UI over there shows up here automatically — no manual
# copy, no silent drift.
#
# The two local touches (this app's favicon + a back control in the header) are
# re-applied here after fetching, so they survive every sync.
#
# If upstream moves or goes private, this job skips with a warning rather than
# failing — lichter.html is committed and keeps working either way. Point it
# somewhere new with the LIGHTS_UI_URL repo variable, or give it a read token
# via the LIGHTS_UI_TOKEN secret if the source is private.

on:
  workflow_dispatch:
  schedule:
    # A few times a day is plenty for a UI that changes rarely.
    - cron: "37 */6 * * *"

permissions:
  contents: write

concurrency:
  group: sync-lights-ui
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch upstream lights UI
        id: fetch
        env:
          # Set LIGHTS_UI_URL as a repo variable to point somewhere else
          # without editing this file. Falls back to the original source.
          LIGHTS_UI_URL: ${{ vars.LIGHTS_UI_URL || 'https://raw.githubusercontent.com/fionnf/linked_friend_lights/master/web_app/index.html' }}
          # Only needed while the source repo is private. Unset = plain fetch.
          LIGHTS_UI_TOKEN: ${{ secrets.LIGHTS_UI_TOKEN }}
        run: |
          echo "Source: $LIGHTS_UI_URL"
          AUTH=()
          if [ -n "$LIGHTS_UI_TOKEN" ]; then
            AUTH=(-H "Authorization: Bearer $LIGHTS_UI_TOKEN")
          fi
          # Unreachable upstream is not a failure of THIS repo. lichter.html is
          # committed and keeps serving; there is simply nothing new to vendor.
          # Failing here just mails a red build every six hours forever, which
          # is how a private-repo 404 went unnoticed until someone checked.
          CODE=$(curl -sSL "${AUTH[@]}" -w "%{http_code}" \
                   -o /tmp/lichter-upstream.html "$LIGHTS_UI_URL" || echo 000)
          if [ "$CODE" != "200" ]; then
            echo "::warning::Upstream returned HTTP $CODE — keeping the vendored lichter.html."
            echo "A 404 here usually means the source repo went private or moved."
            echo "Fix by setting the LIGHTS_UI_URL variable, or the LIGHTS_UI_TOKEN"
            echo "secret if it is private. Skipping this run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A reachable-but-wrong file IS worth failing on: it would overwrite a
          # working page with an error page or someone else's HTML.
          if ! grep -q "Linked Lights" /tmp/lichter-upstream.html; then
            echo "::error::Fetched file doesn't look like the lights app — refusing to vendor it."
            exit 1
          fi

      - name: Re-apply local touches
        if: steps.fetch.outputs.skip != 'true'
        run: |
          python3 scripts/vendor-lights-ui.py /tmp/lichter-upstream.html lichter.html

      - name: Commit and push if changed
        if: steps.fetch.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lichter.html
          if git diff --cached --quiet; then
            echo "Lights UI unchanged."
            exit 0
          fi
          git commit -m "chore(lights): sync lichter.html from linked_friend_lights [skip ci]"
          git pull --rebase origin master
          git push
