name: Push notifications

# Polls the backend for new hugs/wishes and sends a Web Push to the other
# player. Cron is best-effort (GitHub often delays it 5-15 min), so pushes
# aren't instant — email stays the guaranteed channel. Needs three repo
# secrets: VAPID_PRIVATE, VAPID_PUBLIC, BACKUP_ENDPOINT (and optionally
# VAPID_SUBJECT). See PUSH-SETUP.md. Does nothing until those exist.

on:
  workflow_dispatch:
  schedule:
    # Hugs and wishes: as soon as practical.
    - cron: "*/5 * * * *"
    # Reminders: hourly. The backend decides whether the hour is in a window,
    # so this stays correct across DST without touching the cron.
    - cron: "7 * * * *"

concurrency:
  group: push-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ vars.PUSH_ENABLED == 'true' && github.event.schedule != '7 * * * *' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install web-push --no-save
      - name: Send pending pushes
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          BACKUP_ENDPOINT: ${{ secrets.BACKUP_ENDPOINT }}
        run: node scripts/push-poll.cjs

  # Daily reminder + evening streak warning. Separate job on its own hourly
  # schedule: the backend answers "nobody due" outside the two Zurich windows,
  # so 22 of 24 runs are a single cheap GET.
  daily:
    runs-on: ubuntu-latest
    if: ${{ vars.PUSH_ENABLED == 'true' && github.event.schedule != '*/5 * * * *' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install web-push --no-save
      - name: Send due reminders
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          BACKUP_ENDPOINT: ${{ secrets.BACKUP_ENDPOINT }}
        run: node scripts/push-due.cjs
