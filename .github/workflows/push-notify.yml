name: Push notifications

# Polls the backend for new hugs/wishes and sends a Web Push to the other
# player. Cron is best-effort (GitHub often delays it 5-15 min), so pushes
# aren't instant — email stays the guaranteed channel. Needs three repo
# secrets: VAPID_PRIVATE, VAPID_PUBLIC, BACKUP_ENDPOINT (and optionally
# VAPID_SUBJECT). See PUSH-SETUP.md. Does nothing until those exist.

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: push-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    if: ${{ vars.PUSH_ENABLED == 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install web-push --no-save
      - name: Send pending pushes
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          BACKUP_ENDPOINT: ${{ secrets.BACKUP_ENDPOINT }}
        run: node scripts/push-poll.cjs
