  <script>
    // Dark is the default here; set before the page paints so it never flashes light.
    try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem("filmclub:v1") || "{}").theme === "light" ? "light" : "dark"; }
    catch (e) { document.documentElement.dataset.theme = "dark"; }
  </script>

  <script type="module" src="film/app.js"></script>
  <script>
    // Cache the page: the shared worker is network-first, so edits still arrive online.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
    }
  </script>
</body>
</html>
