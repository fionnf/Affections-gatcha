<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gacha · Fionn" />
    <title>Affektions-Gacha · Fionn</title>
    <meta name="description" content="Kuratoren-App für das Affektions-Gacha." />
    <meta name="theme-color" content="#1a3a2c" />
    <meta name="robots" content="noindex, nofollow" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="icon" href="./media/icon-192.png" type="image/png" />
    <link rel="manifest" href="./manifest-fionn.json" />
    <link rel="apple-touch-icon" href="./media/apple-touch-icon.png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #eef5ea;
      }
    </style>
  </head>
  <body>
    <section id="affektions-gacha" style="opacity:0"></section>
    <script>
      // Ensure ?player=fionn is always present so the main app renders in Fionn mode.
      if (!new URLSearchParams(location.search).has("player")) {
        const params = new URLSearchParams(location.search);
        params.set("player", "fionn");
        history.replaceState({}, "", location.pathname + "?" + params.toString());
      }
    </script>
    <script
      src="./dist/affection-gacha.js?v=f276bdae9"
      data-mount="#affektions-gacha"
      data-config-base="./"
      defer
    ></script>
    <script src="./dist/fionn-admin.js?v=f276bdae9" data-mode="tab" defer></script>
  </body>
</html>
