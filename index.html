<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gacha" />
    <title>Lennarts Affektions-Gacha</title>
    <meta
      name="description"
      content="Eine kleine tägliche Gacha-Maschine für Lennart."
    />
    <meta name="theme-color" content="#1a3a2c" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <link rel="icon" href="./media/icon-192.png" type="image/png" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./media/apple-touch-icon.png" />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #0a1410;
      }
    </style>
  </head>
  <body>
    <section id="affektions-gacha" style="opacity:0"></section>
    <script>
      // One player. ?player=lennart is kept on the URL for the sake of old
      // links and the service worker's cache key, nothing reads it any more.
      (function () {
        const params = new URLSearchParams(location.search);
        if (params.get("player") !== "lennart") {
          params.set("player", "lennart");
          history.replaceState({}, "", location.pathname + "?" + params.toString());
        }
      })();
    </script>
    <script
      src="./dist/affection-gacha.js?v=e22449160"
      data-mount="#affektions-gacha"
      data-config-base="./"
      defer
    ></script>
  </body>
</html>
